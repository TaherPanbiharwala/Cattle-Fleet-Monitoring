[project]
name = "cattle-anomaly-assistant"
version = "0.2.0"
description = "Cattle collar behavioral-anomaly detection & explanation assistant (Stage 1 ML + Stage 2 RAG)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
behavior = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
baseline-spc-cusum = "stage1_anomaly_detection.baseline_spc_cusum.cli:main"
behavior-classifier = "stage1_anomaly_detection.behavior_classifier.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "stage1_anomaly_detection*", "stage2_rag_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
