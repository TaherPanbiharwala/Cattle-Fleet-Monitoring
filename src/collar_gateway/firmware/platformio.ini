[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
extra_scripts = pre:extra_scripts/generate_parity_header.py

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  adafruit/Adafruit MLX90614 Library@^2.1.5
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit MPU6050@^2.2.6
  mikalhart/TinyGPSPlus@^1.1.0
extra_scripts =
  ${env.extra_scripts}
  pre:extra_scripts/load_env.py

[env:native]
platform = native
test_build_src = no
test_filter = test_parity
